:root{
  --honey:#F08E00;
  --honey-dark:#C97600;
  --sun:#F7B500;
  --sun-tint:#FDEBC0;
  --bee-yellow:#F9B914;
  --hive-bg:#FFFAF0;
  --panel:#FFFFFF;
  --ink:#1C1710;
  --ink-soft:#3B3020;
  --muted:#6B5A3A;
  --orange-text:#B85F00;
  --line:#B9A88A;
  --wing-shine:#DDEBF7;
  --confetti-blue:#6FB7E6;
  --confetti-pink:#F27BA0;
  --sting:#D9534F;
  --sting-tint:#FBEAEA;
  --radius:22px;
  --radius-banner:26px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;color:var(--ink);font-family:'Nunito',sans-serif;}

  padding:24px 16px 64px;
  background-color:var(--hive-bg);

  background-size:40px 69px;
  background-repeat:repeat;

h1,h2,h3,.tab,button{font-family:'Fredoka',sans-serif;}
.wrap{max-width:680px;margin:0 auto;}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;}
.brand .mark{display:block;}
.brand h1{font-size:23px;margin:0;color:var(--honey-dark);font-weight:700;letter-spacing:.2px;}
.subtitle{color:var(--ink-soft);font-size:13px;margin:0 0 20px;}
.warn{background:var(--sting-tint);color:#8A2E2B;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.tab{flex:1;min-width:100px;text-align:center;padding:11px 10px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-soft);background:var(--panel);border:1.5px solid var(--line);box-shadow:0 1px 2px rgba(59,42,18,.05);transition:border-color .12s, background .12s, color .12s, transform .05s;}
.tab:hover{border-color:var(--honey);color:var(--honey-dark);}
.tab:active{transform:scale(.97);}
.tab.active{background:linear-gradient(135deg,var(--honey),var(--sun));color:var(--ink);border-color:var(--honey-dark);box-shadow:0 3px 8px rgba(201,118,0,.3);transform:translateY(-1px);}
.tab .count{display:inline-block;margin-left:5px;font-size:10px;font-weight:700;background:var(--sting);color:#fff;padding:1px 6px;border-radius:999px;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:0 1px 0 rgba(178,122,8,.05);}
.panel h2{font-size:16px;margin:0 0 14px;color:var(--honey-dark);font-weight:600;}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.panel-head h2{margin:0;}
.panel-head .actions{display:flex;gap:8px;flex-wrap:wrap;}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;margin-bottom:14px;font-family:'Nunito',sans-serif;}
.search-big{padding:16px 18px;font-size:17px;border-radius:12px;}
.child-list{display:flex;flex-direction:column;gap:8px;}
.child-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fffdf7;flex-wrap:wrap;}
.child-info{display:flex;flex-direction:column;gap:2px;}
.child-name{font-weight:600;font-size:15px;}
.child-name-big{font-size:18px;}
.child-row-big{padding:16px 18px;}
.child-meta{font-size:12px;color:var(--ink-soft);}
.class-tag{
  display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;padding:3px 14px;margin-right:6px;
  background:var(--sun-tint);color:var(--honey-dark);
  clip-path:polygon(18% 0%, 82% 0%, 100% 50%, 82% 100%, 18% 100%, 0% 50%);
}
.btn{border:none;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Fredoka',sans-serif;white-space:nowrap;transition:transform .08s ease;}
.btn:active{transform:scale(.95);}
.btn-primary{background:linear-gradient(135deg,var(--honey),var(--sun));color:var(--ink);box-shadow:0 3px 6px rgba(201,118,0,.25);}
.btn-amber{background:linear-gradient(135deg,var(--sun),var(--bee-yellow));color:var(--ink);box-shadow:0 3px 6px rgba(247,181,0,.3);}
.btn-primary:hover{filter:brightness(1.05);}
.btn-outline{background:transparent;border:1.5px solid var(--honey);color:var(--honey-dark);}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
.btn-sm{padding:7px 12px;font-size:13px;}
.btn-big{padding:14px 22px;font-size:15.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.pickup-code{font-weight:700;font-size:15px;letter-spacing:1px;background:var(--sun-tint);color:var(--honey-dark);padding:4px 12px;border-radius:999px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.form-grid label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
.form-grid input,.form-grid select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:'Nunito',sans-serif;}
.full-row{grid-column:1/-1;}
.checkbox-row{display:flex;flex-direction:column;gap:10px;margin:2px 0 10px;}
.checkbox-label{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink);font-weight:500;cursor:pointer;}
.checkbox-label input{width:17px;height:17px;accent-color:var(--honey);cursor:pointer;flex-shrink:0;}
.flag-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 10px;border-radius:999px;margin-right:6px;}
.flag-ok{background:var(--sun-tint);color:var(--honey-dark);}
.flag-warn{background:var(--sting-tint);color:#8A2E2B;}
.flag-expired{background:var(--sting);color:#fff;}
.family-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:#fffdf7;}
.family-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
.family-name{font-weight:700;font-size:15px;color:var(--honey-dark);}
.family-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.family-children{display:flex;flex-direction:column;gap:6px;margin:10px 0;}
.family-child-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;flex-wrap:wrap;}
.add-child-form{margin-top:8px;padding:12px;border:1px dashed var(--line);border-radius:10px;background:#fffef9;}
.add-child-form .form-grid{margin-bottom:8px;}
.empty{text-align:center;color:var(--ink-soft);padding:28px 12px;font-size:14px;}
.overlay{position:fixed;inset:0;background:rgba(59,42,18,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
.celebrate-overlay{position:fixed;inset:0;background:rgba(59,42,18,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:70;overflow:hidden;}
.confetti-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.confetti-piece{position:absolute;top:-20px;border-radius:2px;animation:confetti-fall linear forwards;}
@keyframes confetti-fall{
  0%{transform:translateY(0) rotate(0deg);opacity:1;}
  100%{transform:translateY(105vh) rotate(720deg);opacity:.9;}
}
.firework-burst{position:absolute;width:6px;height:6px;border-radius:50%;animation:firework-pop .7s ease-out forwards;}
@keyframes firework-pop{
  0%{transform:translate(0,0) scale(1);opacity:1;}
  100%{transform:translate(var(--fx),var(--fy)) scale(.3);opacity:0;}
}
.celebrate-card{position:relative;background:var(--panel);border-radius:var(--radius);padding:36px 28px;max-width:380px;width:100%;text-align:center;box-shadow:0 18px 40px rgba(59,42,18,.35);animation:celebrate-pop .4s cubic-bezier(.34,1.56,.64,1);z-index:2;}
@keyframes celebrate-pop{
  0%{transform:scale(.6);opacity:0;}
  100%{transform:scale(1);opacity:1;}
}
.celebrate-emoji{width:76px;height:auto;animation:celebrate-bounce 1s ease-in-out infinite;}
@keyframes celebrate-bounce{
  0%,100%{transform:translateY(0) rotate(-4deg);}
  50%{transform:translateY(-10px) rotate(4deg);}
}
.celebrate-title{font-family:'Fredoka',sans-serif;font-size:24px;line-height:1.25;margin:10px 0 6px;color:var(--orange-text);}
.celebrate-sub{font-size:15px;color:var(--ink-soft);margin:0 0 18px;font-weight:600;}
.celebrate-code-label{font-size:12.5px;color:var(--ink-soft);margin:0 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.modal{background:#fff;border-radius:var(--radius);padding:26px;max-width:360px;width:100%;text-align:center;}
.modal .stamp{width:56px;height:auto;margin-bottom:6px;}
.modal h3{margin:0 0 4px;font-size:18px;color:var(--honey-dark);}
.modal p{margin:4px 0 16px;color:var(--ink-soft);font-size:13px;}
.code-big{font-weight:800;font-size:36px;letter-spacing:4px;color:var(--honey-dark);background:var(--sun-tint);padding:14px 0;border-radius:12px;margin-bottom:16px;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;}
.toast.show{opacity:1;}
.loading{text-align:center;color:var(--ink-soft);padding:40px;font-size:14px;}

/* attendance report table */
.report-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.report-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);border-bottom:2px solid var(--line);padding:8px 6px;font-weight:700;}
.report-table td{padding:9px 6px;border-bottom:1px solid var(--line);}
.report-table tr:last-child td{border-bottom:none;}
.report-summary{font-size:13px;color:var(--ink-soft);margin-bottom:12px;}
.status-out{color:var(--ink-soft);}
.status-in{color:var(--honey-dark);font-weight:600;}

#printReport{display:none;}
#printLabels{display:none;}
@media print{
  body{background:#fff;padding:0;}
  body *{visibility:hidden;}
  #printReport, #printReport *{visibility:visible;}
  #printReport{display:block;position:absolute;top:0;left:0;width:100%;padding:24px;font-family:'Nunito',sans-serif;color:#000;}
  #printReport h2{font-family:'Fredoka',sans-serif;margin:0 0 2px;font-size:20px;}
  #printReport .print-sub{font-size:12px;color:#555;margin-bottom:16px;}
  #printReport table{width:100%;border-collapse:collapse;font-size:12px;}
  #printReport th{text-align:left;border-bottom:2px solid #000;padding:6px 4px;}
  #printReport td{padding:6px 4px;border-bottom:1px solid #ccc;}
  #printLabels, #printLabels *{visibility:visible;}
  #printLabels{display:block;position:absolute;top:0;left:0;width:100%;}
  .label-page{width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;page-break-after:always;font-family:'Nunito',sans-serif;color:#000;}
  .label-page:last-child{page-break-after:auto;}
  .label-role{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#444;margin-bottom:6px;font-weight:700;}
  .label-name{font-size:20px;font-weight:800;margin-bottom:2px;}
  .label-sub{font-size:13px;color:#333;margin-bottom:8px;}
  .label-qr{margin-bottom:8px;}
  .label-code{font-size:22px;font-weight:800;letter-spacing:3px;}
  .label-date{font-size:10px;color:#555;margin-top:4px;}
}
.field-row{text-align:left;margin-bottom:14px;}
.field-row label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
.field-row select,.field-row input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:'Nunito',sans-serif;}
.custom-size-row{display:flex;gap:8px;margin-top:8px;}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap;}
.modal-actions .btn{flex:1;}

.lesson-panel{background:var(--sun-tint);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;}
.lesson-panel .lesson-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--honey-dark);margin-bottom:4px;}
.lesson-panel .lesson-title{font-size:17px;font-weight:600;color:var(--ink);margin-bottom:2px;}
.lesson-panel .lesson-ref{font-size:13px;color:var(--ink-soft);margin-bottom:8px;}
.lesson-panel textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:'Nunito',sans-serif;background:#fffdf7;resize:vertical;}
.lesson-panel .lesson-edit-row{display:flex;gap:8px;margin-top:8px;}
.lesson-panel input.lesson-input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:'Nunito',sans-serif;margin-bottom:8px;}
@media print{.lesson-panel{display:none;}}
.announce-panel{background:#FDE9D0;border:1.5px solid var(--honey);border-radius:var(--radius-banner);padding:14px 16px;margin-bottom:16px;font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:flex-start;gap:10px;}
.announce-panel .announce-close{margin-left:auto;background:none;border:none;color:var(--honey-dark);font-size:13px;font-weight:600;cursor:pointer;padding:2px 6px;}
@media print{.announce-panel{display:none;}}
.emergency-panel{background:var(--sting-tint);border:1.5px solid var(--sting);border-radius:var(--radius-banner);padding:16px 18px;margin-bottom:16px;}
.emergency-panel h2{color:#A32D2D;}
.emergency-panel textarea{border-color:var(--sting);}
.btn-emergency{background:var(--sting);color:#fff;}
.btn-emergency:hover{background:#A32D2D;}
</style>
</head>

function todayStr(){ return new Date().toISOString().slice(0,10); }
function timeStr(iso){ return new Date(iso).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }
function dateLong(){ return new Date().toLocaleDateString([], {weekday:'long', month:'long', day:'numeric', year:'numeric'}); }
function formatDob(dob){ if(!dob) return '—'; const d = new Date(dob+'T00:00:00'); if(isNaN(d)) return dob; return d.toLocaleDateString([], {month:'short', day:'numeric', year:'numeric'}); }
function ageFromDob(dob){
  if(!dob) return '';
  const d = new Date(dob+'T00:00:00');
  if(isNaN(d)) return '';
  const now = new Date();
  let years = now.getFullYear() - d.getFullYear();
  const hasHadBirthdayThisYear = (now.getMonth() > d.getMonth()) || (now.getMonth() === d.getMonth() && now.getDate() >= d.getDate());
  if(!hasHadBirthdayThisYear) years--;
  if(years < 1){
    let months = (now.getFullYear() - d.getFullYear()) * 12 + (now.getMonth() - d.getMonth());
    if(now.getDate() < d.getDate()) months--;
    return Math.max(months,0) + ' mo';
  }
  return years + ' yrs';
}
function formatPhone(el){
  const digits = el.value.replace(/\D/g,'').slice(0,10);
  let out = digits;
  if(digits.length > 7) out = digits.slice(0,4) + ' ' + digits.slice(4,7) + ' ' + digits.slice(7);
  else if(digits.length > 4) out = digits.slice(0,4) + ' ' + digits.slice(4);
  el.value = out;
}
function isTrue(v){ return v === true || v === 'TRUE' || v === 'true'; }
function familyById(id){ return data.families.find(f=>f.id===id) || null; }
function guardianOf(child){ return child ? familyById(child.familyId) : null; }
function flagBadges(child){
  if(!child) return '';
  const toilet = isTrue(child.toiletIndependent);
  const family = guardianOf(child);
  const photo = family ? isTrue(family.photoConsent) : false;
  return `<span class="flag-badge ${toilet?'flag-ok':'flag-warn'}">${toilet?'🚻 Independent':'🚻 Needs help'}</span>`
       + `<span class="flag-badge ${photo?'flag-ok':'flag-warn'}">${photo?'📷 Photo OK':'🚫 No photos'}</span>`;
}
function checkedInToday(){ const d = todayStr(); return data.checkins.filter(c => c.date === d && !c.checkoutTime); }
function leaderCheckedInToday(){ const d = todayStr(); return (data.leaderCheckins||[]).filter(c => c.date === d); }
function allTodayCheckins(){ const d = todayStr(); return data.checkins.filter(c => c.date === d).sort((a,b)=>a.checkinTime.localeCompare(b.checkinTime)); }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }

async function apiGet(){
  const res = await fetch(API_URL, { method: 'GET' });
  return res.json();
}
async function apiPost(body){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
    body: JSON.stringify(body)
  });
  return res.json();
}

async function refresh(){
  try{
    data = await apiGet();
    loaded = true;
  }catch(e){
    console.error(e);
    document.getElementById('app').innerHTML = '<div class="empty">Could not reach the check-in server. Check your internet connection.</div>';
    return;
  }
  render();
}

// Used only by the background auto-refresh timer. Updates the data quietly
// without redrawing the New Child form, so it never wipes out text someone
// is mid-typing. Any action the user takes (adding a child, checking
// someone in, etc.) still calls refresh() directly and updates instantly.
async function pollQuietly(){
  try{
    data = await apiGet();
    loaded = true;
  }catch(e){
    console.error(e);
    return;
  }
  const onFormTab = (isParentMode || isLeaderMode) || ((activeTab === 'families' || activeTab === 'notify' || activeTab === 'safeguarding' || activeTab === 'visitors') && !isParentMode && !isLeaderMode);
  if(onFormTab) return;
  render();
}

function setupChrome(){
  if(API_URL.indexOf('PASTE_YOUR') === 0){
    document.getElementById('configWarning').innerHTML = `<div class="warn">This app isn't connected to a backend yet. Open this file, find the API_URL line near the top, and paste in your Apps Script Web App URL.</div>`;
  }
  if(isParentMode){
    document.getElementById('pageTitle').textContent = 'The Hive — Check In / Out';
    document.getElementById('pageSubtitle').textContent = "Find your child below to check them in or out.";
    document.getElementById('tabsHost').innerHTML = '';
  } else if(isLeaderMode){
    document.getElementById('pageTitle').textContent = 'The Hive — Leader Check-In';
    document.getElementById('pageSubtitle').textContent = "Find your name below to check in for today.";
    document.getElementById('tabsHost').innerHTML = '';
  } else {
    document.getElementById('pageSubtitle').textContent = 'Tap a name below to check a child in.';
    document.getElementById('tabsHost').innerHTML = `
      <div class="tabs">
        <div class="tab active" data-tab="checkin">Check In</div>
        <div class="tab" data-tab="checkout">Today</div>
        <div class="tab" data-tab="families">New Child</div>
        <div class="tab" data-tab="leaders">Leaders</div>
        <div class="tab" data-tab="notify">Notify</div>
        <div class="tab" data-tab="comments">Notes <span class="count" id="commentsCount" style="display:none;">0</span></div>
        <div class="tab" data-tab="safeguarding">Safeguarding</div>
        <div class="tab" data-tab="visitors">Visitors</div>
        <div class="tab" data-tab="report">Today's List</div>
      </div>`;
    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
        t.classList.add('active');
        activeTab = t.dataset.tab;
        render();
      });
    });
  }
}

function render(){
  const app = document.getElementById('app');
  renderAnnouncement();
  renderLesson();
  updateCommentsBadge();
  if(!loaded){ app.innerHTML = '<div class="loading">Loading…</div>'; return; }
  if(isParentMode){ renderParent(app); return; }
  if(isLeaderMode){ renderLeaderSelf(app); return; }
  if(activeTab === 'checkin') renderCheckIn(app);
  else if(activeTab === 'checkout') renderCheckOut(app);
  else if(activeTab === 'leaders') renderLeaders(app);
  else if(activeTab === 'notify') renderNotify(app);
  else if(activeTab === 'comments') renderComments(app);
  else if(activeTab === 'safeguarding') renderSafeguarding(app);
  else if(activeTab === 'visitors') renderVisitors(app);
  else if(activeTab === 'report') renderReport(app);
  else renderFamilies(app);
}

function updateCommentsBadge(){
  const badge = document.getElementById('commentsCount');
  if(!badge) return;
  const unread = (data.comments || []).filter(c => !isTrue(c.read)).length;
  if(unread > 0){ badge.textContent = unread; badge.style.display = 'inline-block'; }
  else { badge.style.display = 'none'; }
}

function renderAnnouncement(){
  const host = document.getElementById('announcementHost');
  if(!loaded || !data.announcement || !data.announcement.message){ host.innerHTML = ''; return; }
  host.innerHTML = `<div class="announce-panel">
    <span>📣</span>
    <span>${escapeHtml(data.announcement.message)}</span>
    ${isParentMode || isLeaderMode ? '' : `<button class="announce-close" onclick="clearAnnouncement()">Dismiss</button>`}
  </div>`;
}

async function clearAnnouncement(){
  await apiPost({ action: 'setAnnouncement', message: '' });
  await refresh();
}

function renderLesson(){
  const host = document.getElementById('lessonHost');
  if(isParentMode){ host.innerHTML = ''; return; }
  const lesson = data.lesson || {};
  if(editingLesson){
    host.innerHTML = `<div class="lesson-panel">
      <div class="lesson-label">Today's lesson</div>
      <input class="lesson-input" id="lessonTitleInput" placeholder="Lesson title, e.g. David and Goliath" value="${escapeHtml(lesson.title||'')}">
      <input class="lesson-input" id="lessonRefInput" placeholder="Reference, e.g. 1 Samuel 17" value="${escapeHtml(lesson.reference||'')}">
      <textarea id="lessonNotesInput" rows="2" placeholder="Notes for leaders (optional)">${escapeHtml(lesson.notes||'')}</textarea>
      <div class="lesson-edit-row">
        <button class="btn btn-primary btn-sm" onclick="saveLesson()">Save</button>
        <button class="btn btn-ghost btn-sm" onclick="editingLesson=false; renderLesson();">Cancel</button>
      </div>
    </div>`;
  } else {
    host.innerHTML = `<div class="lesson-panel">
      <div class="lesson-label">Today's lesson</div>
      <div class="lesson-title">${lesson.title ? escapeHtml(lesson.title) : (isLeaderMode ? 'Not set yet' : 'No lesson set for today')}</div>
      ${lesson.reference ? `<div class="lesson-ref">${escapeHtml(lesson.reference)}</div>` : ''}
      ${lesson.notes ? `<div class="lesson-ref">${escapeHtml(lesson.notes)}</div>` : ''}
      ${isLeaderMode ? '' : `<div class="lesson-edit-row"><button class="btn btn-outline btn-sm" onclick="editingLesson=true; renderLesson();">${lesson.title ? 'Edit' : 'Set lesson'}</button></div>`}

async function saveLesson(){
  const lesson = {
    date: todayStr(),
    title: document.getElementById('lessonTitleInput').value.trim(),
    reference: document.getElementById('lessonRefInput').value.trim(),
    notes: document.getElementById('lessonNotesInput').value.trim()
  };
  const res = await apiPost({ action: 'setLesson', lesson });
  if(res.error){ toast(res.error); return; }
  editingLesson = false;
  await refresh();
  toast('Lesson saved');
}

/* ---------------- STAFF: CHECK IN ---------------- */
function renderCheckIn(app){
  const q = (document.getElementById('checkinSearch')?.value || '').toLowerCase();
  const checkedIds = new Set(checkedInToday().map(c=>c.childId));
  const list = q ? data.roster.filter(c => c.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name)) : [];
  let rows = list.map(c => {
    const already = checkedIds.has(c.id);
    const age = ageFromDob(c.dob);
    const guardian = guardianOf(c);
    return `<div class="child-row child-row-big">
      <div class="child-info">
        <span class="child-name child-name-big">${escapeHtml(c.name)}</span>
        <span class="child-meta">${age ? age+' · ' : ''}${guardian ? escapeHtml(guardian.guardianName) : ''}</span>
      </div>
      ${already ? `<button class="btn btn-ghost btn-big" disabled>✓ Checked in</button>` : `<button class="btn btn-primary btn-big" onclick="doCheckIn('${c.id}')">Check In</button>`}
    </div>`;
  }).join('');
  if(q && !list.length) rows = `<div class="empty">No matches.</div>`;
  app.innerHTML = `<div class="panel">
    <h2>Check in a child</h2>
    <input class="search search-big" id="checkinSearch" placeholder="Search by name…" value="${escapeHtml(q)}" oninput="renderCheckIn(document.getElementById('app'))">
    <div class="child-list">${rows}</div>
  </div>`;
  const el = document.getElementById('checkinSearch');
  if(el){ el.focus(); const v=el.value; el.value=v; el.selectionStart=el.selectionEnd=v.length; }
}

async function doCheckIn(childId){
  const codeInput = prompt("Choose a 4-digit pickup code to remember (leave blank for a random one):");
  if(codeInput === null) return;
  const code = codeInput.trim();
  const res = await apiPost({ action: 'checkIn', childId, code: code || undefined });
  if(res.error){ toast(res.error); return; }
  await refresh();
  const child = data.roster.find(c=>c.id===childId);
  showCelebration(child.name, res.code, `<button class="btn btn-amber" style="width:100%;margin-top:8px;" onclick="this.closest('.celebrate-overlay').remove();openPrintModal('${res.id}')">Print Labels</button>`);
}

/* ---------------- STAFF: CHECKED IN ---------------- */
function renderCheckOut(app){
  const list = checkedInToday().sort((a,b)=>a.checkinTime.localeCompare(b.checkinTime));
  const rosterById = Object.fromEntries(data.roster.map(c=>[c.id,c]));
  let rows = list.map(c => `<div class="child-row">
      <div class="child-info">
        <span class="child-name">${escapeHtml(c.childName)}</span>
        <span class="child-meta"><span class="class-tag">${escapeHtml(formatDob(c.dob))}</span>${flagBadges(rosterById[c.childId])}Checked in ${timeStr(c.checkinTime)}</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <span class="pickup-code">${c.code}</span>
        <button class="btn btn-outline btn-sm" onclick="notifyToilet('${c.childId}','${escapeHtml(c.childName)}')" title="Notify guardian">🚻</button>
        <button class="btn btn-outline btn-sm" onclick="openPrintModal('${c.id}')" title="Reprint labels">🖨</button>
        <button class="btn btn-outline" onclick="promptCheckOut('${c.id}','${escapeHtml(c.childName)}')">Check Out</button>
      </div>
    </div>`).join('');
  if(!list.length) rows = `<div class="empty">No children currently checked in.</div>`;
  app.innerHTML = `<div class="panel"><h2>Currently checked in</h2><div class="child-list">${rows}</div></div>`;
}

async function notifyToilet(childId, childName){
  const res = await apiPost({ action: 'notifyToilet', childId });
  if(res.error){ toast(res.error); return; }
  toast(`Guardian notified — ${childName} needs the toilet`);
}

function promptCheckOut(recordId, name){
  const code = prompt(`Enter the pickup code for ${name}:`);
  if(code === null) return;
  doCheckOut(recordId, code.trim());
}

async function doCheckOut(recordId, code){
  const res = await apiPost({ action: 'checkOut', recordId, code });
  if(res.error){ toast(res.error); return; }
  await refresh();
  toast('See you next time! 🍯');
}

/* ---------------- STAFF: FAMILIES ---------------- */
function familyMatches(family, q, kids){
  if(!q) return true;
  if(family.guardianName.toLowerCase().includes(q)) return true;
  return kids.some(c => c.name.toLowerCase().includes(q));
}

function renderFamilies(app){
  const q = (document.getElementById('familySearch')?.value || '').toLowerCase();
  const childrenByFamily = {};
  data.roster.forEach(c => {
    if(!childrenByFamily[c.familyId]) childrenByFamily[c.familyId] = [];
    childrenByFamily[c.familyId].push(c);
  });

  const families = [...data.families]
    .filter(f => familyMatches(f, q, childrenByFamily[f.id] || []))
    .sort((a,b) => a.guardianName.localeCompare(b.guardianName));

  let cards = families.map(f => {
    const kids = (childrenByFamily[f.id] || []).sort((a,b)=>a.name.localeCompare(b.name));
    const kidRows = kids.map(c => `<div class="family-child-row">
        <div class="child-info">
          <span class="child-name">${escapeHtml(c.name)}</span>
          <span class="child-meta"><span class="class-tag">${escapeHtml(formatDob(c.dob))}</span><span class="flag-badge ${isTrue(c.toiletIndependent)?'flag-ok':'flag-warn'}">${isTrue(c.toiletIndependent)?'🚻 Independent':'🚻 Needs help'}</span>${c.notes ? escapeHtml(c.notes) : ''}${c.email ? ' · '+escapeHtml(c.email) : ''}</span>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="removeChild('${c.id}')">Remove</button>
      </div>`).join('');

    const guardian2Line = f.guardian2Name
      ? `<div class="family-meta">2nd guardian: ${escapeHtml(f.guardian2Name)}${f.guardian2Phone ? ' · '+escapeHtml(f.guardian2Phone) : ''}${f.guardian2Email ? ' · '+escapeHtml(f.guardian2Email) : ''}</div>`
      : '';

    return `<div class="family-card">
      <div class="family-header">
        <div>
          <div class="family-name">${escapeHtml(f.guardianName)}</div>
          <div class="family-meta">${f.phone ? escapeHtml(f.phone)+' · ' : ''}${isTrue(f.photoConsent) ? '📷 Photo OK' : '🚫 No photos'}${f.email ? ' · '+escapeHtml(f.email) : ''}</div>
          ${guardian2Line}
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" onclick="editFamilyModal('${f.id}')">Edit</button>
          <button class="btn btn-ghost btn-sm" onclick="removeFamily('${f.id}')">Remove family</button>
        </div>
      </div>
      <div class="family-children">${kidRows || `<div class="empty" style="padding:10px;">No children added yet.</div>`}</div>
      <div class="add-child-form">
        <div class="form-grid">
          <div><label>Child's name</label><input id="cf_name_${f.id}" placeholder="e.g. Ruby"></div>
          <div><label>Date of Birth</label><input type="date" id="cf_dob_${f.id}"></div>
          <div class="full-row"><label>Email (staff records)</label><input id="cf_email_${f.id}" placeholder="Optional — for internal use only"></div>
          <div class="full-row"><label>Notes / allergies</label><textarea id="cf_notes_${f.id}" rows="1" placeholder="Optional"></textarea></div>
          <div class="full-row checkbox-row" style="margin:0;">
            <label class="checkbox-label"><input type="checkbox" id="cf_toilet_${f.id}"> Can go to the toilet by themselves</label>
          </div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="addChildToFamily('${f.id}')">+ Add child to this family</button>
      </div>
    </div>`;
  }).join('');

  if(!families.length) cards = `<div class="empty">${data.families.length ? 'No matches.' : 'No families added yet — use the form above to add your first one.'}</div>`;

  app.innerHTML = `
    <div class="panel">
      <h2>Add a family</h2>
      <div class="form-grid">
        <div><label>Guardian 1 name</label><input id="fam_guardian" placeholder="Tony Stark"></div>
        <div><label>Guardian 1 phone (required)</label><input id="fam_phone" placeholder="0423 074 957" oninput="formatPhone(this)"></div>
        <div class="full-row"><label>Guardian 1 email (for notifications)</label><input id="fam_email" placeholder="tony@starkindustries.com"></div>
        <div><label>Guardian 2 name (optional)</label><input id="fam_guardian2" placeholder="Pepper Potts"></div>
        <div><label>Guardian 2 phone (optional)</label><input id="fam_phone2" placeholder="0423 074 958" oninput="formatPhone(this)"></div>
        <div class="full-row"><label>Guardian 2 email (optional)</label><input id="fam_email2" placeholder="pepper@starkindustries.com"></div>
        <div class="full-row checkbox-row">
          <label class="checkbox-label"><input type="checkbox" id="fam_photo"> Photo consent given</label>
        </div>
      </div>
      <button class="btn btn-primary" onclick="addFamily()">Add family</button>
    </div>
    <div class="panel">
      <h2>Families</h2>
      <input class="search" id="familySearch" placeholder="Search by guardian or child name…" value="${escapeHtml(q)}" oninput="renderFamilies(document.getElementById('app'))">
      ${cards}
    </div>`;
}

async function addFamily(){
  const guardianName = document.getElementById('fam_guardian').value.trim();
  if(!guardianName){ toast('Enter a guardian name first'); return; }
  const phone = document.getElementById('fam_phone').value.trim();
  if(!phone){ toast('Enter a guardian phone number'); return; }
  const family = {
    guardianName,
    phone,
    email: document.getElementById('fam_email').value.trim(),
    guardian2Name: document.getElementById('fam_guardian2').value.trim(),
    guardian2Phone: document.getElementById('fam_phone2').value.trim(),
    guardian2Email: document.getElementById('fam_email2').value.trim(),
    photoConsent: document.getElementById('fam_photo').checked
  };
  const res = await apiPost({ action: 'addFamily', family });
  if(res.error){ toast(res.error); return; }
  await refresh();
  toast(`${guardianName} added — now add their children below`);
}

async function removeFamily(id){
  if(!confirm('Remove this family and all children under it from the Hive? This cannot be undone.')) return;
  const res = await apiPost({ action: 'deleteFamily', id });
  if(res.error){ toast(res.error); return; }
  await refresh();
  toast('Family removed');
}

/* ---------------- STAFF: LEADERS ---------------- */
function blueCardBadge(l){
  if(!l.blueCardNumber && !l.blueCardExpiry){
    return `<span class="flag-badge flag-warn">🪪 No card on file</span>`;
  }
  if(!l.blueCardExpiry){
    return `<span class="flag-badge flag-warn">🪪 No expiry on file</span>`;
  }
  const expiry = new Date(l.blueCardExpiry + 'T00:00:00');
  const daysLeft = Math.floor((expiry - new Date()) / 86400000);
  if(daysLeft < 0) return `<span class="flag-badge flag-expired">🪪 Blue Card EXPIRED</span>`;
  if(daysLeft <= 30) return `<span class="flag-badge flag-warn">🪪 Expires in ${daysLeft}d</span>`;
  return `<span class="flag-badge flag-ok">🪪 Valid to ${formatDob(l.blueCardExpiry)}</span>`;
}

function renderLeaders(app){
  const checkedIds = new Set(leaderCheckedInToday().map(c=>c.leaderId));
  const list = [...data.leaders].sort((a,b)=>a.name.localeCompare(b.name));
  let rows = list.map(l => {
    const in_ = checkedIds.has(l.id);
    return `<div class="child-row">
      <div class="child-info">
        <span class="child-name">${escapeHtml(l.name)}</span>
        <span class="child-meta">${l.role ? escapeHtml(l.role) : 'Leader'}${in_ ? ' · Checked in today' : ''}</span>
        <div style="margin-top:4px;">${blueCardBadge(l)}</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${in_ ? `<button class="btn btn-ghost" disabled>✓ Checked in</button>` : `<button class="btn btn-primary" onclick="doLeaderCheckIn('${l.id}')">Check In</button>`}
        <button class="btn btn-outline btn-sm" onclick="editLeaderModal('${l.id}')">Edit</button>
        <button class="btn btn-ghost" onclick="removeLeader('${l.id}')">Remove</button>
      </div>
    </div>`;
  }).join('');
  if(!list.length) rows = `<div class="empty">No leaders added yet — use the form above.</div>`;

  const parentUrl = new URL(location.href);
  parentUrl.search = 'leader=1';

  app.innerHTML = `
    <div class="panel">
      <h2>Add a leader</h2>
      <div class="form-grid">
        <div><label>Leader's name</label><input id="l_name" placeholder="e.g. Jess Turner"></div>
        <div><label>Role / team</label><input id="l_role" placeholder="e.g. Class teacher"></div>
        <div><label>Blue Card number</label><input id="l_bluecard" placeholder="Optional — add when available"></div>
        <div><label>Blue Card expiry</label><input type="date" id="l_bluecard_expiry"></div>
      </div>
      <button class="btn btn-primary" onclick="addLeader()">Add leader</button>
    </div>
    <div class="panel">
      <div class="panel-head">
        <h2>Leaders</h2>
      </div>
      <p style="font-size:12.5px;color:var(--ink-soft);margin:-8px 0 14px;">Share this link so leaders can check themselves in each Sunday: ${escapeHtml(parentUrl.toString())}</p>
      <div class="child-list">${rows}</div>
    </div>`;
}

async function addLeader(){
  const name = document.getElementById('l_name').value.trim();
  if(!name){ toast('Enter a name first'); return; }
  const leader = {
    name,
    role: document.getElementById('l_role').value.trim(),
    blueCardNumber: document.getElementById('l_bluecard').value.trim(),
    blueCardExpiry: document.getElementById('l_bluecard_expiry').value
  };
  const res = await apiPost({ action: 'addLeader', leader });
  if(res.error){ toast(res.error); return; }
  await refresh();
  toast(`${name} added as a leader`);
}

async function removeLeader(id){
  if(!confirm('Remove this leader?')) return;
  const res = await apiPost({ action: 'deleteLeader', id });
  if(res.error){ toast(res.error); return; }
  await refresh();
  toast('Leader removed');
}

function editLeaderModal(id){
  const l = data.leaders.find(x=>x.id===id);
  if(!l) return;
  const div = document.createElement('div');
  div.className = 'overlay';
  div.innerHTML = `<div class="modal">
    <h3>Edit ${escapeHtml(l.name)}</h3>
    <div class="field-row"><label>Role / team</label><input id="editRole" value="${escapeHtml(l.role||'')}"></div>
    <div class="field-row"><label>Blue Card number</label><input id="editBlueCard" value="${escapeHtml(l.blueCardNumber||'')}"></div>
    <div class="field-row"><label>Blue Card expiry</label><input type="date" id="editBlueCardExpiry" value="${l.blueCardExpiry||''}"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="this.closest('.overlay').remove()">Cancel</button>
      <button class="btn btn-primary" onclick="saveLeaderEdit('${id}')">Save</button>
    </div>
  </div>`;
  document.body.appendChild(div);
}

async function saveLeaderEdit(id){
  const leader = {
    role: document.getElementById('editRole').value.trim(),
    blueCardNumber: document.getElementById('editBlueCard').value.trim(),
    blueCardExpiry: document.getElementById('editBlueCardExpiry').value
  };
  const res = await apiPost({ action: 'updateLeader', id, leader });
  if(res.error){ toast(res.error); return; }
  const modal = document.querySelector('.overlay');
  if(modal) modal.remove();
  await refresh();
  toast('Leader details updated');
}

async function doLeaderCheckIn(id){
  const res = await apiPost({ action: 'leaderCheckIn', leaderId: id });
  if(res.error){ toast(res.error); return; }
  await refresh();
  const leader = data.leaders.find(l=>l.id===id);
  toast(`${leader ? leader.name : 'Leader'} checked in — thanks for serving today! 🐝`);
}

/* ---------------- STAFF: NOTIFY PARENTS ---------------- */
function renderNotify(app){
  const withEmail = data.families.filter(f => f.email && f.email.trim()).length;
  const total = data.families.length;
  const currentAnnouncement = data.announcement && data.announcement.message ? data.announcement.message : '';
  app.innerHTML = `<div class="panel emergency-panel">
    <h2>🚨 Emergency alert</h2>
    <p style="font-size:13px;color:#8A2E2B;margin:-4px 0 14px;">For urgent situations only — posts a red banner in the app immediately AND emails every guardian with an address on file (${withEmail} of ${total} families), all in one tap.</p>
    <div class="form-grid" style="grid-template-columns:1fr;">
      <div class="full-row"><label>Emergency message</label><textarea id="emergencyMessage" rows="3" placeholder="Building evacuated — please collect your child from the main car park immediately."></textarea></div>
    </div>
    <button class="btn btn-emergency" onclick="sendEmergencyAlert()">Send emergency alert now</button>
  </div>
  <div class="panel">
    <h2>Post an announcement in the app</h2>
    <p style="font-size:13px;color:var(--ink-soft);margin:-4px 0 14px;">Shows as a banner at the top of the app for everyone — staff, leaders, and parents — the moment they open it. No email address needed.</p>
    ${currentAnnouncement ? `<div class="announce-panel" style="margin-bottom:14px;"><span>📣</span><span>${escapeHtml(currentAnnouncement)}</span></div>` : ''}
    <div class="form-grid" style="grid-template-columns:1fr;">
      <div class="full-row"><label>Message</label><textarea id="announceMessage" rows="3" placeholder="No Sunday School this week — see you the 24th!">${escapeHtml(currentAnnouncement)}</textarea></div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-primary" onclick="postAnnouncement()">${currentAnnouncement ? 'Update banner' : 'Post banner'}</button>
      ${currentAnnouncement ? `<button class="btn btn-ghost" onclick="clearAnnouncement()">Remove banner</button>` : ''}
    </div>
  </div>
  <div class="panel">
    <h2>Email parents</h2>
    <p style="font-size:13px;color:var(--ink-soft);margin:-4px 0 14px;">Sends an email to every guardian who has an email address on file (${withEmail} of ${total} families). Each parent only sees their own address, not the full list.</p>
    <div class="form-grid" style="grid-template-columns:1fr;">
      <div><label>Subject</label><input id="notifySubject" placeholder="No Sunday School this week"></div>
      <div class="full-row"><label>Message</label><textarea id="notifyMessage" rows="5" placeholder="Write the message parents will see..."></textarea></div>
    </div>
    <button class="btn btn-primary" onclick="sendNotification()" ${withEmail === 0 ? 'disabled' : ''}>Send to ${withEmail} parent${withEmail === 1 ? '' : 's'}</button>
    ${withEmail === 0 ? `<p style="font-size:12.5px;color:var(--ink-soft);margin-top:10px;">No families have an email on file yet — add one in the Families tab to enable this.</p>` : ''}
  </div>
  <div class="panel">
    <h2>Automatic weekly reminder</h2>
    <p style="font-size:13px;color:var(--ink-soft);margin:-4px 0;">Every Friday evening, an email automatically goes out to all ${withEmail} parent${withEmail === 1 ? '' : 's'} with an email on file reminding them Sunday School is on — including whatever's currently posted in the app banner above, if anything. This runs on its own once set up in Apps Script; nothing to do here each week.</p>
  </div>
  <div class="panel">
    <h2>"Things to know" for parents</h2>
    <p style="font-size:13px;color:var(--ink-soft);margin:-4px 0 14px;">Shows as a permanent reference section at the top of the parent app — drop-off/pickup process, photo policy, what to bring, allergy procedures, anything parents might want to check back on. Unlike the banner above, this isn't urgent or time-limited.</p>
    <div class="form-grid" style="grid-template-columns:1fr;">
      <div class="full-row"><label>Content</label><textarea id="thingsToKnowInput" rows="6" placeholder="e.g. Drop-off is 9:15–9:30am at the hall entrance. Please check your child in yourself rather than sending them alone. Photos are only taken of children whose family has given consent...">${escapeHtml(data.thingsToKnow && data.thingsToKnow.content ? data.thingsToKnow.content : '')}</textarea></div>
    </div>
    <button class="btn btn-primary" onclick="saveThingsToKnow()">Save</button>
  </div>`;
}

async function saveThingsToKnow(){
  const content = document.getElementById('thingsToKnowInput').value.trim();
  const res = await apiPost({ action: 'setThingsToKnow', content });
  if(res.error){ toast(res.error); return; }
  await refresh();
  toast('Saved');
}

async function sendEmergencyAlert(){
  const message = document.getElementById('emergencyMessage').value.trim();
  if(!message){ toast('Enter a message first'); return; }
  if(!confirm('This immediately posts an urgent banner and emails every parent with an address on file. Send now?')) return;
  const res = await apiPost({ action: 'emergencyAlert', message });
  if(res.error){ toast(res.error); return; }
  await refresh();
  toast(`Emergency alert sent to ${res.sentCount} parent${res.sentCount === 1 ? '' : 's'} and posted in the app`);
  document.getElementById('emergencyMessage').value = '';
}

async function postAnnouncement(){
  const message = document.getElementById('announceMessage').value.trim();
  if(!message){ toast('Enter a message first'); return; }
  const res = await apiPost({ action: 'setAnnouncement', message });
  if(res.error){ toast(res.error); return; }
  await refresh();
  toast('Banner posted');
}

async function sendNotification(){
  const subject = document.getElementById('notifySubject').value.trim();
  const message = document.getElementById('notifyMessage').value.trim();
  if(!subject){ toast('Enter a subject first'); return; }
  if(!message){ toast('Enter a message first'); return; }
  if(!confirm('Send this to every parent with an email on file?')) return;
  const res = await apiPost({ action: 'notifyParents', subject, message });
  if(res.error){ toast(res.error); return; }
  toast(`Sent to ${res.sentCount} parent${res.sentCount === 1 ? '' : 's'}`);
  document.getElementById('notifySubject').value = '';
  document.getElementById('notifyMessage').value = '';
}

function renderLeaderSelf(app){
  const q = (document.getElementById('leaderSearch')?.value || '').toLowerCase();
  const checkedIds = new Set(leaderCheckedInToday().map(c=>c.leaderId));
  const list = q ? data.leaders.filter(l => l.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name)) : [];
  let rows = list.map(l => {
    const in_ = checkedIds.has(l.id);
    return `<div class="child-row">
      <div class="child-info">
        <span class="child-name">${escapeHtml(l.name)}</span>
        <span class="child-meta">${l.role ? escapeHtml(l.role) : 'Leader'}</span>
      </div>
      ${in_ ? `<button class="btn btn-ghost" disabled>✓ You're checked in</button>` : `<button class="btn btn-primary" onclick="leaderSelfCheckIn('${l.id}')">I'm here</button>`}
    </div>`;
  }).join('');
  if(q && !list.length) rows = `<div class="empty">No leader matches that name. Ask staff to add you first.</div>`;
  app.innerHTML = `<div class="panel">
    <h2>Find your name</h2>
    <input class="search" id="leaderSearch" placeholder="Type your name…" value="${escapeHtml(q)}" oninput="renderLeaderSelf(document.getElementById('app'))">
    <div class="child-list">${rows}</div>
  </div>`;
  const el = document.getElementById('leaderSearch');
  if(el){ el.focus(); const v=el.value; el.value=v; el.selectionStart=el.selectionEnd=v.length; }
}

function renderComments(app){
  const list = [...(data.comments || [])];
  let rows = list.map(c => {
    const unread = !isTrue(c.read);
    return `<div class="child-row" style="${unread ? 'border-color:var(--honey);background:var(--sun-tint);' : ''}">
      <div class="child-info">
        <span class="child-name">${c.childName ? escapeHtml(c.childName) : '(no child named)'} ${unread ? '<span class="flag-badge flag-warn">New</span>' : ''}</span>
        <span class="child-meta" style="display:block;margin:4px 0;color:var(--ink);font-size:13px;">${escapeHtml(c.message)}</span>
        <span class="child-meta">${new Date(c.timestamp).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})}</span>
      </div>
      <div style="display:flex;gap:8px;">
        ${unread ? `<button class="btn btn-outline btn-sm" onclick="markRead('${c.id}')">Mark read</button>` : ''}
        <button class="btn btn-ghost btn-sm" onclick="removeComment('${c.id}')">Delete</button>
      </div>
    </div>`;
  }).join('');
  if(!list.length) rows = `<div class="empty">No notes from parents yet.</div>`;
  app.innerHTML = `<div class="panel"><h2>Notes from parents</h2><div class="child-list">${rows}</div></div>`;
}

async function markRead(id){
  await apiPost({ action: 'markCommentRead', id });
  await refresh();
}

async function removeComment(id){
  if(!confirm('Delete this note?')) return;
  const res = await apiPost({ action: 'deleteComment', id });
  if(res.error){ toast(res.error); return; }
  await refresh();
  toast('Note deleted');
}

/* ---------------- STAFF: SAFEGUARDING REGISTER ---------------- */
function renderSafeguarding(app){
  const list = [...(data.safeguarding || [])];
  let rows = list.map(e => {
    const resolved = e.status === 'resolved';
    return `<div class="child-row" style="${resolved ? '' : 'border-color:var(--sting);background:var(--sting-tint);'}">
      <div class="child-info">
        <span class="child-name">${e.childName ? escapeHtml(e.childName) : '(general / no child named)'} <span class="flag-badge ${resolved ? 'flag-ok' : 'flag-warn'}">${resolved ? 'Resolved' : 'Open'}</span></span>
        <span class="child-meta" style="display:block;margin:4px 0;color:var(--ink);font-size:13px;">${escapeHtml(e.description)}</span>
        <span class="child-meta">Reported by ${escapeHtml(e.reportedBy || 'Unknown')} · ${new Date(e.dateTime).toLocaleString([], {month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'})}</span>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline btn-sm" onclick="toggleSafeguardingStatus('${e.id}','${resolved ? 'open' : 'resolved'}')">${resolved ? 'Reopen' : 'Mark resolved'}</button>
      </div>
    </div>`;
  }).join('');
  if(!list.length) rows = `<div class="empty">No entries yet.</div>`;

  app.innerHTML = `<div class="panel emergency-panel">
    <h2>New safeguarding entry</h2>
    <p style="font-size:13px;color:#8A2E2B;margin:-4px 0 14px;">For recording any concern or incident involving a child, per your Child and Youth Risk Management Strategy. Entries are permanent — they can be marked resolved but never deleted, to preserve the record.</p>
    <div class="form-grid" style="grid-template-columns:1fr;">
      <div><label>Child's name (leave blank if general)</label><input id="sg_child" placeholder="e.g. Ruby Chen"></div>
      <div><label>Your name (reported by)</label><input id="sg_reporter" placeholder="e.g. Jess Turner"></div>
      <div class="full-row"><label>What happened</label><textarea id="sg_description" rows="4" placeholder="Record what was observed or reported, and any immediate action taken."></textarea></div>
    </div>
    <button class="btn btn-emergency" onclick="addSafeguardingEntry()">Save entry</button>
  </div>
  <div class="panel">
    <h2>Register</h2>
    <div class="child-list">${rows}</div>
  </div>`;
}

async function addSafeguardingEntry(){
  const childName = document.getElementById('sg_child').value.trim();
  const reportedBy = document.getElementById('sg_reporter').value.trim();
  const description = document.getElementById('sg_description').value.trim();
  if(!reportedBy){ toast('Enter your name first'); return; }
  if(!description){ toast('Enter what happened first'); return; }
  if(!confirm('Save this entry? Safeguarding entries are permanent and cannot be deleted.')) return;
  const res = await apiPost({ action: 'addSafeguardingEntry', childName, reportedBy, description });
  if(res.error){ toast(res.error); return; }
  await refresh();
  toast('Entry saved to the register');
}

async function toggleSafeguardingStatus(id, status){
  await apiPost({ action: 'setSafeguardingStatus', id, status });
  await refresh();
}

/* ---------------- STAFF: VISITORS ---------------- */
function visitorsToday(){ const d = todayStr(); return (data.visitors||[]).filter(v => v.date === d && !v.checkoutTime); }
function allTodayVisitors(){ const d = todayStr(); return (data.visitors||[]).filter(v => v.date === d).sort((a,b)=>a.checkinTime.localeCompare(b.checkinTime)); }

function renderVisitors(app){
  const list = visitorsToday().sort((a,b)=>a.checkinTime.localeCompare(b.checkinTime));
  let rows = list.map(v => `<div class="child-row">
      <div class="child-info">
        <span class="child-name">${escapeHtml(v.name)}</span>
        <span class="child-meta">${v.age ? v.age+' yrs · ' : ''}${escapeHtml(v.guardianName||'')}${v.allergies ? ' · '+escapeHtml(v.allergies) : ''}</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <span class="pickup-code">${v.code}</span>
        <button class="btn btn-outline" onclick="promptVisitorCheckOut('${v.id}','${escapeHtml(v.name)}')">Check Out</button>
      </div>
    </div>`).join('');
  if(!list.length) rows = `<div class="empty">No visitors checked in today.</div>`;

  app.innerHTML = `<div class="panel">
    <h2>Check in a visitor</h2>
    <p style="font-size:13px;color:var(--ink-soft);margin:-4px 0 14px;">For one-off guests who aren't part of the regular roster — just the basics.</p>
    <div class="form-grid" style="grid-template-columns:1fr 1fr;">
      <div><label>Child's name</label><input id="v_name" placeholder="e.g. Max Rockatansky"></div>
      <div><label>Age</label><input type="number" min="0" id="v_age" placeholder="e.g. 6"></div>
      <div><label>Guardian name</label><input id="v_guardian" placeholder="e.g. Furiosa"></div>
      <div><label>Guardian phone</label><input id="v_phone" placeholder="0423 074 957" oninput="formatPhone(this)"></div>
      <div class="full-row"><label>Allergies</label><input id="v_allergies" placeholder="Optional"></div>
    </div>
    <button class="btn btn-primary" onclick="checkInVisitor()">Check In Visitor</button>
  </div>
  <div class="panel">
    <h2>Visitors checked in today</h2>
    <div class="child-list">${rows}</div>
  </div>`;
}

function promptVisitorCheckOut(id, name){
  const code = prompt(`Enter the pickup code for ${name}:`);
  if(code === null) return;
  doVisitorCheckOut(id, code.trim());
}

async function doVisitorCheckOut(id, code){
  const res = await apiPost({ action: 'checkOutVisitor', id, code });
  if(res.error){ toast(res.error); return; }
  await refresh();
  toast('Visitor checked out');
}

function downloadCsv(){
  const list = allTodayCheckins();
  const rosterById = Object.fromEntries(data.roster.map(c=>[c.id,c]));
  const header = ['Name','Date of Birth','Guardian','Guardian phone','Toilet independent','Photo consent','Checked in','Checked out'];
  const lines = [header.join(',')];
  list.forEach(c => {
    const child = rosterById[c.childId] || {};
    const family = guardianOf(child) || {};
    const cells = [
      c.childName, formatDob(c.dob),
      family.guardianName || '', family.phone || '',
      isTrue(child.toiletIndependent) ? 'Yes' : 'No',
      isTrue(family.photoConsent) ? 'Yes' : 'No',
      new Date(c.checkinTime).toLocaleString(),
      c.checkoutTime ? new Date(c.checkoutTime).toLocaleString() : ''
    ].map(v => `"${String(v).replace(/"/g,'""')}"`);
    lines.push(cells.join(','));
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `hive-attendance-${todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

    <div class="form-grid" style="grid-template-columns:1fr;">
      <div><label>Child's name</label><input id="commentChildName" placeholder="e.g. Ruby Chen" value="${escapeHtml(commentChildVal)}"></div>
      <div class="full-row"><label>Note</label><textarea id="commentMessage" rows="3" placeholder="e.g. Ruby's grandma is picking her up today instead of me">${escapeHtml(commentMsgVal)}</textarea></div>
    </div>
    <button class="btn btn-primary" onclick="sendComment()">Send note</button>
  </div>`;
  const el = document.getElementById('parentSearch');
  if(el){ el.focus(); const v=el.value; el.value=v; el.selectionStart=el.selectionEnd=v.length; }
}

async function sendComment(){
  const childName = document.getElementById('commentChildName').value.trim();
  const message = document.getElementById('commentMessage').value.trim();
  if(!message){ toast('Enter a note first'); return; }
  const res = await apiPost({ action: 'addComment', childName, message });
  if(res.error){ toast(res.error); return; }
  document.getElementById('commentChildName').value = '';
  document.getElementById('commentMessage').value = '';
  toast('Note sent to the teachers');
}

async function parentCheckIn(childId){
  const codeInput = prompt("Choose a 4-digit pickup code you'll remember (leave blank for a random one):");
  if(codeInput === null) return;
  const code = codeInput.trim();
  const res = await apiPost({ action: 'checkIn', childId, code: code || undefined });
  if(res.error){ toast(res.error); return; }
  await refresh();
  const child = data.roster.find(c=>c.id===childId);
  showCelebration(child.name, res.code);
}

function parentCheckOut(recordId, name){
  const code = prompt(`Enter the code you were given when ${name} was checked in:`);
  if(code === null) return;
  doCheckOut(recordId, code.trim());
}

/* ---------------- PRINT LABELS ---------------- */
const LABEL_PRESETS = {
  dymo_2_1_6x4: {name:'DYMO 30334 (2-1/6" × 4")', w:2.1666, h:4},
  brother_29x90: {name:'Brother QL 29mm × 90mm', w:1.142, h:3.543},
  brother_62_cont: {name:'Brother QL 62mm × 100mm (continuous)', w:2.441, h:3.937},
  zebra_2x3: {name:'Zebra 2" × 3"', w:2, h:3},
  custom: {name:'Custom size…'}
};
let labelSettings = { size: 'dymo_2_1_6x4', customW: 2, customH: 3 };

function openPrintModal(recordId){
  const rec = data.checkins.find(c=>c.id===recordId);
  if(!rec){ toast('Could not find that check-in record'); return; }
  const opts = Object.keys(LABEL_PRESETS).map(k =>
    `<option value="${k}" ${labelSettings.size===k?'selected':''}>${LABEL_PRESETS[k].name}</option>`
  ).join('');
  const isCustom = labelSettings.size === 'custom';
  const div = document.createElement('div');
  div.className = 'overlay';
  div.id = 'printModal';
  div.innerHTML = `<div class="modal">
    <h3>Print labels for ${escapeHtml(rec.childName)}</h3>
    <p>Prints a child tag and a parent claim tag, both with the pickup code.</p>
    <div class="field-row">
      <label>Label printer / size</label>
      <select id="labelSizeSelect" onchange="onLabelSizeChange()">${opts}</select>
      <div class="custom-size-row" id="customSizeRow" style="${isCustom?'':'display:none'}">
        <input type="number" step="0.1" min="0.5" id="customW" placeholder="Width (in)" value="${labelSettings.customW}">
        <input type="number" step="0.1" min="0.5" id="customH" placeholder="Height (in)" value="${labelSettings.customH}">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="this.closest('.overlay').remove()">Cancel</button>
      <button class="btn btn-primary" onclick="doPrintLabels('${rec.id}')">Print</button>
    </div>
  </div>`;
  document.body.appendChild(div);
}

function onLabelSizeChange(){
  const v = document.getElementById('labelSizeSelect').value;
  document.getElementById('customSizeRow').style.display = v === 'custom' ? 'flex' : 'none';
}

function doPrintLabels(recordId){
  const rec = data.checkins.find(c=>c.id===recordId);
  if(!rec) return;

  const sizeKey = document.getElementById('labelSizeSelect').value;
  labelSettings.size = sizeKey;
  let w, h;
  if(sizeKey === 'custom'){
    w = parseFloat(document.getElementById('customW').value) || 2;
    h = parseFloat(document.getElementById('customH').value) || 3;
    labelSettings.customW = w;
    labelSettings.customH = h;
  } else {
    w = LABEL_PRESETS[sizeKey].w;
    h = LABEL_PRESETS[sizeKey].h;
  }

  let pageStyle = document.getElementById('pageSizeStyle');
  if(!pageStyle){
    pageStyle = document.createElement('style');
    pageStyle.id = 'pageSizeStyle';
    document.head.appendChild(pageStyle);
  }
  pageStyle.textContent = `@page{ size: ${w}in ${h}in; margin: 0; }`;

  const child = data.roster.find(c=>c.id===rec.childId);
  const family = guardianOf(child);
  const printArea = document.getElementById('printLabels');
  printArea.innerHTML = `
    <div class="label-page">
      <div class="label-role">Child Tag</div>
      <div class="label-name">${escapeHtml(rec.childName)}</div>
      <div class="label-sub">${escapeHtml(formatDob(rec.dob))}</div>
      <div class="label-qr" id="qr_child_${rec.id}"></div>
      <div class="label-code">${rec.code}</div>
      <div class="label-date">${dateLong()}</div>
    </div>
    <div class="label-page">
      <div class="label-role">Parent Claim Tag</div>
      <div class="label-name">${escapeHtml(rec.childName)}</div>
      <div class="label-sub">${family ? 'Guardian: '+escapeHtml(family.guardianName) : 'Present this tag at pickup'}</div>
      <div class="label-qr" id="qr_parent_${rec.id}"></div>
      <div class="label-code">${rec.code}</div>
      <div class="label-date">${dateLong()}</div>
    </div>`;

  try{
    new QRCode(document.getElementById(`qr_child_${rec.id}`), { text: rec.code, width: 110, height: 110 });
    new QRCode(document.getElementById(`qr_parent_${rec.id}`), { text: rec.code, width: 110, height: 110 });
  }catch(e){ console.error(e); }

  const modal = document.getElementById('printModal');
  if(modal) modal.remove();

  setTimeout(()=>{ window.print(); }, 150);
}

function showModal(html){
  const div = document.createElement('div');
  div.className = 'overlay';
  div.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(div);
}

function spawnConfetti(layer){
  if(!layer) return;
  const count = 60;
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const color = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
    const size = 6 + Math.random()*6;
    p.style.left = Math.random()*100 + '%';
    p.style.width = size + 'px';
    p.style.height = (size*0.4) + 'px';
    p.style.background = color;
    p.style.animationDuration = (2.2 + Math.random()*1.3) + 's';
    p.style.animationDelay = (Math.random()*0.5) + 's';
    layer.appendChild(p);
  }
  // Mini firework bursts at a couple of random points
  const burstPoints = [ [30,25], [70,20], [50,35] ];
  burstPoints.forEach((pt,idx)=>{
    setTimeout(()=>spawnFirework(layer, pt[0], pt[1]), idx*220);
  });
  setTimeout(()=>{ if(layer) layer.innerHTML=''; }, 4000);
}

function spawnFirework(layer, xPct, yPct){
  if(!layer) return;
  const particles = 16;
  for(let i=0;i<particles;i++){
    const angle = (Math.PI*2/particles) * i;
    const dist = 40 + Math.random()*30;
    const fx = Math.cos(angle)*dist;
    const fy = Math.sin(angle)*dist;
    const dot = document.createElement('div');
    dot.className = 'firework-burst';
    dot.style.left = xPct + '%';
    dot.style.top = yPct + '%';
    dot.style.background = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
    dot.style.setProperty('--fx', fx+'px');
    dot.style.setProperty('--fy', fy+'px');
    layer.appendChild(dot);
  }
}

setupChrome();
refresh();
setInterval(pollQuietly, 60000); // 1 minute
